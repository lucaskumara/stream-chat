<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Emotes are remote images, so img-src must allow https:. script-src keeps
      'unsafe-inline' because the dev server injects the React Refresh preamble
      inline; tighten this to a nonce when packaging lands in Phase 5. Remote
      script *origins* are blocked either way, and chat content is never
      injected as HTML.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:* ; object-src 'none'; base-uri 'none'"
    />
    <title>stream-chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
