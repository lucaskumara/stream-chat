<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This is the *dev* policy. electron.vite.config.ts rewrites it at build time
      (see PACKAGED_CSP) so the shipped page drops the allowances only the dev
      server needs. Emotes are remote images, so img-src must allow https: in
      both. Chat content is never injected as HTML.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:* ; object-src 'none'; base-uri 'none'"
    />
    <title>stream-chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
