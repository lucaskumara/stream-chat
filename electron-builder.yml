appId: com.lucaskumara.streamchat
productName: Stream Chat

publish:
  provider: github
  owner: lucaskumara
  repo: stream-chat

directories:
  buildResources: build
  output: release

files:
  - '!src/*'
  - '!electron-builder.yml'
  - '!CLAUDE.md'
  - '!{tests,tests/**}'
  - '!{vitest.config.ts,electron.vite.config.ts}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}'
  - '!{.env,.env.*,.npmrc,.gitattributes}'
  - '!**/*.tsbuildinfo'

# ffmpeg cannot be executed from inside app.asar, so it is unpacked beside it. The relay
# resolves its path by swapping app.asar for app.asar.unpacked.
asarUnpack:
  - 'node_modules/ffmpeg-static/**'

win:
  executableName: stream-chat
  target:
    - nsis
    - portable

portable:
  artifactName: ${name}-${version}-portable.${ext}
  unpackDirName: stream-chat-${version}

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.social-networking
  target: dmg

linux:
  category: Network
  target: AppImage

npmRebuild: false
